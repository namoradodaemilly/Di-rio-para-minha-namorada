<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Diário 💚💙💜</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            font-family: Georgia, serif;
            color: white;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(0, 255, 170, 0.25),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 90% 90%,
                    rgba(150, 70, 255, 0.30),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 50% 50%,
                    rgba(30, 150, 255, 0.10),
                    transparent 45%
                ),

                linear-gradient(
                    135deg,
                    #06141f,
                    #0b1224,
                    #170d25
                );

            overflow-x: hidden;
        }


        /* =========================
           CAPA
        ========================= */

        .capa {

            position: relative;

            width: 100%;
            max-width: 650px;

            padding: 60px 30px;

            text-align: center;

            background: rgba(8, 18, 30, 0.82);

            border: 1px solid rgba(120, 255, 220, 0.35);

            border-radius: 28px;

            backdrop-filter: blur(10px);

            box-shadow:

                0 0 25px rgba(0, 255, 170, 0.15),

                0 0 50px rgba(50, 150, 255, 0.10),

                0 0 70px rgba(170, 80, 255, 0.12);

            animation: aparecer 1.5s ease;
        }


        /* =========================
           CORAÇÕES
        ========================= */

        .coracoes {

            font-size: 30px;

            letter-spacing: 8px;

            margin-bottom: 25px;

            animation: flutuar 3s ease-in-out infinite;
        }


        /* =========================
           TÍTULO
        ========================= */

        h1 {

            font-size: 44px;

            margin-bottom: 20px;

            background:

                linear-gradient(
                    90deg,
                    #63ffb2,
                    #70d9ff,
                    #c78aff
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;

            text-shadow:

                0 0 20px rgba(120, 220, 255, 0.15);
        }


        /* =========================
           SUBTÍTULO
        ========================= */

        .subtitulo {

            font-size: 20px;

            line-height: 1.6;

            color: #eeeeff;

            margin-bottom: 25px;
        }


        /* =========================
           PERÍODO
        ========================= */

        .periodo {

            font-size: 17px;

            color: #a9ffe0;

            margin-bottom: 35px;
        }


        /* =========================
           BOTÃO
        ========================= */

        .botao {

            border: none;

            border-radius: 30px;

            padding: 16px 32px;

            font-size: 17px;

            font-weight: bold;

            color: white;

            cursor: pointer;

            background:

                linear-gradient(
                    90deg,
                    #168c63,
                    #277fc4,
                    #793cb0
                );

            box-shadow:

                0 0 18px rgba(55, 220, 180, 0.25),

                0 0 20px rgba(160, 90, 255, 0.20);

            transition:

                transform 0.3s ease,

                box-shadow 0.3s ease;
        }


        .botao:hover {

            transform: scale(1.06);

            box-shadow:

                0 0 25px rgba(70, 255, 190, 0.45),

                0 0 30px rgba(180, 100, 255, 0.35);
        }


        /* =========================
           RODAPÉ
        ========================= */

        .rodape {

            margin-top: 35px;

            font-size: 14px;

            color: #c8c8dc;
        }


        /* =========================
           ANIMAÇÕES
        ========================= */

        @keyframes aparecer {

            from {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.96);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes flutuar {

            0%,
            100% {

                transform:
                    translateY(0);
            }

            50% {

                transform:
                    translateY(-8px);
            }
        }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 600px) {

            .capa {

                padding:
                    45px
                    22px;
            }

            h1 {

                font-size: 34px;
            }

            .subtitulo {

                font-size: 17px;
            }

            .coracoes {

                font-size: 24px;

                letter-spacing: 4px;
            }
        }

    </style>

</head>


<body>


    <main class="capa">


        <div class="coracoes">

            💚 💙 💜

        </div>


        <h1>

            Meu Diário

        </h1>


        <p class="subtitulo">

            Para a pessoa mais importante da minha vida 💚

        </p>


        <p class="periodo">

            01/09/2026 — 22/09/2026

        </p>


        <button
            class="botao"
            onclick="abrirDiario()">

            📖 Abrir meu diário

        </button>


        <p class="rodape">

            Escrito com muito amor,
            carinho e algumas bobagens
            hihihihi ✨

        </p>


    </main>


    <script>

        function abrirDiario() {

            alert(
                "Nosso diário vai começar... 💚💙💜"
            );

        }

    </script>


</body>

</html>
